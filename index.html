<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel-art Gaussian splat worlds</title>
<style>
  :root { --a: #ff3fa4; --b: #3fe0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05050c; overflow: hidden; color: #e8e6f5;
    font: 12px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
  .hud { position: fixed; left: 0; right: 0; padding: 10px 12px; pointer-events: none; display: flex; gap: 8px; align-items: flex-start; }
  #top { top: 0; justify-content: space-between; }
  #bot { bottom: 0; flex-wrap: wrap; justify-content: center; padding-bottom: 14px; }
  .tag { background: rgba(5, 5, 14, .72); border: 1px solid rgba(255, 255, 255, .14); padding: 6px 8px; }
  h1 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--a); font-weight: 700; }
  #stat { color: #a9a6c4; margin-top: 2px; }
  button { pointer-events: auto; font: inherit; color: #e8e6f5; background: rgba(5, 5, 14, .78); border: 1px solid var(--b);
    min-height: 44px; min-width: 44px; padding: 0 12px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; box-shadow: 3px 3px 0 rgba(0, 0, 0, .6); }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, .6); }
  button:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
  #shatter, #vr { border-color: var(--a); color: var(--a); }
  [hidden] { display: none !important; }
  .seed { display: flex; align-items: stretch; pointer-events: auto; }
  .seed span { display: flex; align-items: center; padding: 0 10px; background: rgba(5, 5, 14, .78); border-top: 1px solid var(--b); border-bottom: 1px solid var(--b); min-width: 76px; justify-content: center; }
  #err { display: none; position: fixed; inset: 20% 8%; padding: 16px; background: #1a0612; border: 1px solid #ff4d7a; color: #ffd0dc; white-space: pre-wrap; overflow: auto; }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated pixel-art scene rendered from Gaussian splats"></canvas>
<div class="hud" id="top">
  <div class="tag"><h1 id="title">…</h1><div id="stat">starting…</div></div>
  <div class="tag">drag · pinch</div>
</div>
<div class="hud" id="bot">
  <div class="seed"><button id="prev" aria-label="Previous seed">◀</button><span>seed&nbsp;<b id="seed">0</b></span><button id="next" aria-label="Next seed">▶</button></div>
  <button id="rand">Random</button>
  <button id="scene">Scene</button>
  <button id="shatter">Shatter</button>
  <button id="pix">Pixels: fine</button>
  <button id="vr" hidden>Enter VR</button>
  <button id="ply" hidden>Export .ply</button>
</div>
<div id="err" role="alert"></div>
